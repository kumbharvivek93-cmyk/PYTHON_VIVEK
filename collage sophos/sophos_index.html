<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SOPHOS</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
        }

        .header {
            background-color: #1a5fb4;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            width: 350px;
            margin: 60px auto;
            background: #e9ecef;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #1a5fb4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #144a8a;
        }

        .link {
            margin-top: 15px;
            display: block;
            color: #1a5fb4;
            text-decoration: none;
            font-size: 14px;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        SOPHOS
    </div>

    <div class="container">
        <h2>Sign in with your Sophos ID™</h2>

        <form action="#" method="POST">
            <input type="text" name="username" placeholder="enter your username" required>
            <br>
            <input type="password" name="password" placeholder="enter your password" required>

            <button class="btn">Continue</button>
        </form>

        <a href="#" class="link">Create Sophos ID™</a>
    </div>

</body>
</html>
